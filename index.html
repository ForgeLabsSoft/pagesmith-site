<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagesmith</title>
<meta name="description" content="Pagesmith: convert, scan, sign and edit PDFs on iPhone, iPad and Mac. Everything runs on your device.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --ink: #1c1c1e; --soft: #555; --line: #e3e3e6; --back: #f7f7f8; --card: #fff; --accent: #d7262f; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f7; --soft: #aaa; --line: #2c2c2e; --back: #111; --card: #1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--back); color: var(--ink); display: grid; place-items: center; padding: 24px;
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .card { max-width: 480px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 40px 32px; }
  img { width: 112px; height: 112px; margin: 0 auto 14px; display: block; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: -0.02em; }
  p { color: var(--soft); margin: 0 0 24px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.button { display: inline-block; padding: 11px 20px; border-radius: 10px; text-decoration: none; color: var(--accent);
             border: 1px solid var(--line); font-weight: 600; font-size: 0.95rem; }
  .ro { margin-top: 22px; font-size: 0.9rem; }
  .ro a { color: var(--accent); }
  footer { margin-top: 22px; color: var(--soft); font-size: 0.8rem; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="">
    <h1>Pagesmith</h1>
    <p>Convert, scan, sign and edit PDFs on iPhone, iPad and Mac. Everything runs on your device: no uploads, no account, no subscription.</p>
    <div class="links">
      <a class="button" href="privacy/">Privacy Policy</a>
      <a class="button" href="support/">Support</a>
    </div>
    <p class="ro">În română: <a href="privacy/#ro">Confidențialitate</a> · <a href="support/#ro">Asistență</a></p>
    <footer>© 2026 ForgeLabsSoft</footer>
  </div>
</body>
</html>
